[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-unpacker"
version = "0.1.0"
description = "Robust unpacker for eval(function(p,a,c,k,e,d){...})(...) JavaScript packers"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Brandon Love" }
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
beautify = ["jsbeautifier>=1.15.1"]

[project.urls]
Homepage = "https://github.com/Love2150"
Issues = "https://github.com/issues"

[project.scripts]
eval-unpacker = "eval_unpacker.cli:main"

